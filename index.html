<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width'>
    <title>sudoku42: the only real time multiplayer sudoku</title>
    <meta name="description" content="Join me in this multiplayer sudoku game!">

    <meta property="og:title" content="sudoku42 · Challenge your friends 🧩" />
    <meta property="og:url" content="https://sudoku42.com/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:description" content="Solve the daily puzzle or join a multiplayer game with unlimited players. Compare your times with friends and the world. Join us?">
    <meta property="og:image" content="https://sudoku42.com/img/og-card.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">

    <link href="index.css?v=4" rel="stylesheet" type="text/css" />
    <script src="translate.js?v=23" defer></script>
    <script>
        var params = new URLSearchParams(window.location.search)
        if (params.has('id')) {
            window.document.title = params.get('id') + ' - sudoku42'
        }
        // The intent link only works on Android, so the open button stays Android-only. iOS users get the App Store badge.
        var isAndroid = /Android/.test(navigator.userAgent)
        window.addEventListener('DOMContentLoaded', function () {
            if (isAndroid && (params.has('id') || params.has('daily') || params.has('group'))) {
                var open = document.getElementById('open-in-app')
                // An intent link opens the app directly (even when the tap comes from this same host) and falls back to Play.
                var playStore = 'https://play.google.com/store/apps/details?id=com.mriezebosch.sudoku'
                open.href = 'intent://sudoku42.com' + window.location.pathname + window.location.search +
                    '#Intent;scheme=https;package=com.mriezebosch.sudoku;S.browser_fallback_url=' + encodeURIComponent(playStore) + ';end'
                open.hidden = false
            }
        })
    </script>
</head>

<body>
    <div class="center">
        <div>
            <a href="https://play.google.com/store/apps/details?id=com.mriezebosch.sudoku">
                <img class="store-badge" src="img/playstore.svg" width="224" height="66" alt="Google Play" />
            </a>
            <a href="https://apps.apple.com/app/id1529294991">
                <img class="store-badge" src="img/appstore.svg?v=3" width="224" height="66" alt="Download on the App Store" />
            </a>
        </div>
        <p>
            <a id="open-in-app" class="open-in-app" hidden>Open in the sudoku42 app</a>
        </p>
        <p>
            <button id="share-button" class="share-button" type="button" data-i18n="shareSmall" data-i18n-attr="aria-label:shareAria">Share sudoku42</button>
        </p>
        <p class="share-status" role="status" aria-live="polite"></p>
        <ul class="contact">
            <li><a href="mailto:mriezebosch@gmail.com?subject=sudoku42" data-i18n="contact">Contact Manuel</a></li>
        </ul>
    </div>
    <script>
        // Native share sheet where available; otherwise copy the link to the clipboard.
        (function () {
            var t = window.sudoku42T || function (key) { return key }
            var url = 'https://sudoku42.com/'
            var button = document.getElementById('share-button')
            var status = document.querySelector('.share-status')

            function copyLink() {
                if (!navigator.clipboard) {
                    status.textContent = url
                    return
                }
                navigator.clipboard.writeText(url).then(function () {
                    status.textContent = t('copied')
                }, function () {
                    status.textContent = url
                })
            }

            button.addEventListener('click', function () {
                status.textContent = ''
                if (navigator.share) {
                    navigator.share({ url: url }).catch(function (error) {
                        if (error.name !== 'AbortError') copyLink()
                    })
                    return
                }
                copyLink()
            })
        })()
    </script>
</body>
</html>
